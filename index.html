    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-tile.svg" />
    <link rel="apple-touch-icon" href="/logo-tile.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Menu Hub</title>
    <script>
      // Apply theme before first paint to avoid a flash. Dark is the default —
      // only an explicit 'light' choice opts out.
      try { if (localStorage.getItem('mh-theme') !== 'light') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
